<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Wpisz działanie z wynikiem i sprawdź, czy jest poprawne.">
  <title>Sprawdzacz działań</title>
  <style>
    :root { color-scheme: dark; --bg:#101827; --accent:#8ca5ff; --border:rgba(255,255,255,.16); --fg:#f8fafc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--fg); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; transition:background-color .32s ease; }
    body.correct { --bg:#075b3b; --accent:#a9ffd3; --border:rgba(183,255,218,.5); }
    body.incorrect { --bg:#8c2031; --accent:#ffd1d7; --border:rgba(255,210,218,.48); }
    main { width:min(100%,850px); text-align:center; }
    .eyebrow { text-transform:uppercase; letter-spacing:.22em; font-size:.75rem; font-weight:750; color:var(--accent); }
    h1 { font-size:clamp(2rem,6vw,4.2rem); line-height:1.1; letter-spacing:-.055em; margin:16px 0; }
    .intro { color:#d5dce9; font-size:clamp(1rem,2vw,1.2rem); margin:0 0 40px; }
    .input-wrap { position:relative; }
    textarea { display:block; width:100%; min-height:180px; padding:42px 26px; resize:vertical; border:2px solid var(--border); border-radius:26px; outline:none; background:rgba(255,255,255,.095); color:#fff; box-shadow:0 20px 70px rgba(0,0,0,.13); text-align:center; font:650 clamp(1.8rem,6vw,4rem)/1.35 ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:-.045em; transition:border-color .2s,background .2s; }
    textarea:focus { border-color:var(--accent); background:rgba(255,255,255,.13); }
    textarea::placeholder { color:rgba(255,255,255,.43); }
    .status { min-height:70px; display:flex; justify-content:center; align-items:center; gap:12px; font-size:1.16rem; font-weight:650; }
    .dot { width:12px; height:12px; border-radius:50%; background:#a0aabc; box-shadow:0 0 0 5px rgba(255,255,255,.09); }
    .correct .dot { background:#a9ffd3; box-shadow:0 0 0 5px rgba(169,255,211,.18); }
    .incorrect .dot { background:#ffd1d7; box-shadow:0 0 0 5px rgba(255,209,215,.18); }
    .hint { color:#d1d8e5; font-size:.95rem; line-height:1.7; }
    kbd { padding:2px 7px; border:1px solid rgba(255,255,255,.2); border-radius:6px; font:inherit; white-space:nowrap; }
    button { margin-top:24px; border:1px solid rgba(255,255,255,.25); border-radius:12px; padding:12px 20px; color:#fff; background:rgba(255,255,255,.1); cursor:pointer; font:600 1rem inherit; }
    button:hover { background:rgba(255,255,255,.19); }
    button:focus-visible { outline:3px solid white; outline-offset:3px; }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Matematyka bez zgadywania</div>
    <h1>Sprawdź swoje działanie</h1>
    <p class="intro">Wpisz obliczenie i wynik. Kolor tła powie Ci, czy masz rację.</p>
    <div class="input-wrap">
      <textarea id="expression" rows="2" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Działanie matematyczne" aria-describedby="status hint" placeholder="4 + 4 = 8"></textarea>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="statusText">Czekam na Twoje działanie</span></div>
    <p id="hint" class="hint">Obsługiwane: <kbd>+</kbd> <kbd>−</kbd> <kbd>×</kbd> <kbd>÷</kbd> <kbd>^</kbd> i nawiasy. Przykład: <kbd>(5 + 3) × 2 = 16</kbd></p>
    <button type="button" id="clear">Wyczyść</button>
  </main>
  <script>
    'use strict';
    const input = document.getElementById('expression');
    const statusText = document.getElementById('statusText');
    const clear = document.getElementById('clear');
    const EPS = 1e-9;

    // Parser matematyczny bez eval() i bez uruchamiania kodu wpisanego przez użytkownika.
    function calculate(source) {
      const text = source.replace(/\s+/g, '').replace(/[×·]/g, '*').replace(/[÷:]/g, '/').replace(/[−–]/g, '-').replace(/,/g, '.');
      if (!text || text.length > 300) throw Error('invalid');
      let pos = 0;
      function number() {
        const match = /^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/.exec(text.slice(pos));
        if (!match) throw Error('invalid');
        pos += match[0].length;
        return Number(match[0]);
      }
      function primary() {
        if (text[pos] === '(') {
          pos++;
          const result = sum();
          if (text[pos] !== ')') throw Error('invalid');
          pos++;
          return result;
        }
        return number();
      }
      function power() {
        const base = primary();
        if (text[pos] === '^') { pos++; return Math.pow(base, unary()); }
        return base;
      }
      function unary() {
        if (text[pos] === '+') { pos++; return unary(); }
        if (text[pos] === '-') { pos++; return -unary(); }
        return power();
      }
      function product() {
        let value = unary();
        while (text[pos] === '*' || text[pos] === '/') {
          const operator = text[pos++];
          const right = unary();
          value = operator === '*' ? value * right : value / right;
        }
        return value;
      }
      function sum() {
        let value = product();
        while (text[pos] === '+' || text[pos] === '-') {
          const operator = text[pos++];
          const right = product();
          value = operator === '+' ? value + right : value - right;
        }
        return value;
      }
      const result = sum();
      if (pos !== text.length || !Number.isFinite(result)) throw Error('invalid');
      return result;
    }
    function update() {
      document.body.classList.remove('correct', 'incorrect');
      const text = input.value.trim();
      const parts = text.split('=');
      if (!text) { statusText.textContent = 'Czekam na Twoje działanie'; return; }
      if (parts.length !== 2 || !parts[0].trim() || !parts[1].trim()) {
        statusText.textContent = 'Wpisz pełne działanie z wynikiem';
        return;
      }
      try {
        const left = calculate(parts[0]);
        const right = calculate(parts[1]);
        const correct = Math.abs(left - right) <= EPS * Math.max(1, Math.abs(left), Math.abs(right));
        document.body.classList.add(correct ? 'correct' : 'incorrect');
        statusText.textContent = correct ? 'Poprawnie! ✓' : 'Spróbuj jeszcze raz ✕';
      } catch {
        statusText.textContent = 'Sprawdź zapis działania';
      }
    }
    input.addEventListener('input', update);
    clear.addEventListener('click', () => { input.value = ''; update(); input.focus(); });
    update();
  </script>
</body>
</html>
